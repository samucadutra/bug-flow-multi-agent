[project]
name = "bugflow"
version = "0.1.0"
description = "BugFlow multi-agent bug triage backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings",
    "typer",
]

[project.scripts]
bugflow = "bugflow.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugflow"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not integration'"
markers = [
    "integration: tests that call real services (Docker); run only with `pytest -m integration`",
]
