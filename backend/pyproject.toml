[project]
name = "bugflow"
version = "0.1.0"
description = "BugFlow multi-agent bug triage backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "crewai",
    "jinja2>=3.1,<4",
    "openai>=2.0,<3",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings",
    "sqlalchemy>=2.1.3",
    "typer",
]

[project.scripts]
bugflow = "bugflow.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugflow"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers -m 'not integration'"
markers = [
    "integration: tests that call real services (Docker); run only with `pytest -m integration`",
]

[tool.ruff.lint.per-file-ignores]
"src/bugflow/seed/bugs.py" = ["E501"]
